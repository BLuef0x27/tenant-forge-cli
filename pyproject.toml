[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-forge"
version = "0.1.0"
description = "Customer tenant onboarding CLI and Terraform scaffolding for isolated per-tenant AWS environments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christopher M. Huffstetler" }]
keywords = ["terraform", "aws", "multi-tenant", "field-engineering", "appsec"]
dependencies = [
    "typer>=0.12.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tenant-forge = "tenant_forge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
